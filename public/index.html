<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>香港幼稚園排名</title>
    <meta
      name="description"
      content="香港 18 區幼稚園排名：綜合家長評分及 Google 評分，列出每區最受好評的幼稚園。Hong Kong kindergarten rankings by district, combining parent ratings and Google ratings."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%88%3C/text%3E%3C/svg%3E"
    />
    <!-- AdSense: setupAds() loads the ad script once adConfig (below) has real IDs.
         For AdSense site verification, also add: <meta name="google-adsense-account" content="ca-pub-..."> -->
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --blue: #1d4ed8;
        --blue-dark: #1e3a8a;
        --text: #0f172a;
        --muted: #475569;
        --line: #dbe3ef;
        --star: #f59e0b;
        --ok: #047857;
        --error: #b91c1c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang HK', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }

      a { color: var(--blue); }

      .wrap {
        max-width: 1150px;
        margin: 0 auto;
        padding: 22px;
      }

      .hero {
        background: var(--panel);
        border-radius: 14px;
        padding: 22px;
        border: 1px solid var(--line);
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .hero h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.25;
      }

      .hero h1 a {
        color: inherit;
        text-decoration: none;
      }

      .hero p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .meta-panel {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-soft);
      }

      .meta-panel summary {
        cursor: pointer;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--muted);
      }

      .meta-body {
        display: grid;
        gap: 6px;
        padding: 0 12px 12px;
      }

      .meta-row {
        font-size: 13px;
        color: var(--muted);
      }

      .filters {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .filters select,
      .filters input,
      .account-row input,
      .review-form textarea {
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        background: #fff;
        color: var(--text);
      }

      .filters input[type='search'] {
        flex: 1 1 280px;
        min-width: 0;
      }

      .filters input[type='number'] {
        width: 120px;
      }

      .account-panel,
      .verify-panel {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-soft);
      }

      .account-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }

      .account-text {
        font-size: 14px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .verify-panel p {
        margin: 0;
      }

      .account-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }

      .account-row input {
        width: 140px;
      }

      button,
      .button {
        display: inline-block;
        border-radius: 10px;
        border: none;
        background: var(--blue);
        color: #fff;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }

      button:hover,
      .button:hover {
        background: var(--blue-dark);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #e2e8f0;
        color: var(--text);
      }

      .btn-secondary:hover {
        background: #cbd5e1;
      }

      .status {
        margin: 14px 0;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
      }

      .status.error,
      .form-message.error {
        color: var(--error);
      }

      .form-message.ok {
        color: var(--ok);
      }

      .form-message {
        font-size: 14px;
        min-height: 1.2em;
      }

      .ad-slot {
        margin: 12px 0;
        border: 1px dashed #94a3b8;
        border-radius: 10px;
        background: var(--panel-soft);
        padding: 10px;
      }

      .ad-label {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .area-section {
        background: var(--panel);
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 14px;
        margin-bottom: 14px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      }

      .area-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .area-head h2,
      .area-head h3 {
        margin: 0;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .area-table {
        width: 100%;
        border-collapse: collapse;
      }

      .area-table th,
      .area-table td {
        border: 1px solid var(--line);
        padding: 10px;
        text-align: left;
        vertical-align: top;
      }

      .area-table th {
        background: #eef2f7;
        font-weight: 700;
        font-size: 14px;
      }

      .col-rank {
        width: 52px;
        text-align: center !important;
        color: var(--muted);
        font-weight: 700;
        white-space: nowrap;
      }

      .col-num {
        width: 120px;
        white-space: nowrap;
      }

      .school-row {
        cursor: pointer;
      }

      .school-row:hover {
        background: #f1f5ff;
      }

      .school-link {
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
      }

      .school-link:hover,
      .school-link:focus-visible {
        color: var(--blue);
        text-decoration: underline;
      }

      .subtext,
      .count {
        color: var(--muted);
        font-size: 13px;
      }

      .score {
        font-weight: 700;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }

      .tag {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        background: #e2e8f0;
        color: #334155;
      }

      .tag-PUBLIC { background: #dcfce7; color: #166534; }
      .tag-PRIVATE { background: #fef3c7; color: #92400e; }
      .tag-INTERNATIONAL { background: #e0e7ff; color: #3730a3; }

      .mobile-stats {
        display: none;
      }

      .empty {
        color: var(--muted);
      }

      .profile {
        background: var(--panel);
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 16px;
      }

      .profile h2 {
        margin: 0;
      }

      .score-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
        margin: 16px 0;
      }

      .score-card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        background: var(--panel-soft);
      }

      .score-card .label,
      .score-card .hint {
        font-size: 13px;
        color: var(--muted);
      }

      .score-card .value {
        font-size: 26px;
        font-weight: 700;
      }

      .details {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 0;
      }

      .details dt {
        color: var(--muted);
      }

      .details dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .review-form {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 8px;
        max-width: 560px;
      }

      .review-form h3,
      .review-form p {
        margin: 0;
      }

      .star-fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }

      .star-fieldset legend {
        padding: 0;
        margin-bottom: 2px;
      }

      .star-input {
        display: inline-flex;
        flex-direction: row-reverse;
        gap: 2px;
      }

      .star-input input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }

      .star-input label {
        font-size: 34px;
        line-height: 1;
        color: #cbd5e1;
        cursor: pointer;
        padding: 0 2px;
      }

      .star-input input:checked ~ label,
      .star-input label:hover,
      .star-input label:hover ~ label {
        color: var(--star);
      }

      .star-input input:focus-visible + label {
        outline: 2px solid var(--blue);
        border-radius: 4px;
      }

      .toolbar {
        margin-bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .hidden {
        display: none !important;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .chat-toggle {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 80;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
      }

      .chat-panel {
        position: fixed;
        right: 18px;
        bottom: 72px;
        width: 340px;
        max-width: calc(100vw - 24px);
        height: 440px;
        max-height: calc(100vh - 100px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
        z-index: 80;
        display: flex;
        flex-direction: column;
      }

      .chat-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chat-head button {
        padding: 2px 10px;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .chat-bubble {
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
        max-width: 90%;
      }

      .chat-bot {
        background: #eef2ff;
        border: 1px solid #c7d2fe;
      }

      .chat-user {
        background: #dbeafe;
        border: 1px solid #93c5fd;
        margin-left: auto;
      }

      .chat-quick {
        padding: 0 10px 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chat-quick button {
        background: #e2e8f0;
        color: var(--text);
        padding: 6px 8px;
        font-size: 12px;
      }

      .chat-input {
        border-top: 1px solid var(--line);
        padding: 10px;
        display: flex;
        gap: 8px;
      }

      .chat-input input {
        flex: 1;
        min-width: 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }

      @media (max-width: 640px) {
        .wrap { padding: 12px; }
        .hero { padding: 16px; }
        .hero h1 { font-size: 22px; }
        .filters select,
        .filters input[type='number'] { flex: 1 1 40%; width: auto; }
        .area-table th,
        .area-table td { padding: 8px 6px; }
        .col-rank { width: auto; }
        .col-num { width: auto; }
        .col-hide-mobile { display: none; }
        .mobile-stats { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
        .score-cards { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .score-card { padding: 8px; }
        .score-card .value { font-size: 20px; }
        .score-card .label,
        .score-card .hint { font-size: 11px; }
        .details { grid-template-columns: 1fr; gap: 0; }
        .details dd { margin-bottom: 8px; }
        .chat-panel { right: 12px; left: 12px; width: auto; bottom: 66px; height: 65vh; }
        .chat-toggle { right: 12px; bottom: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="hero-top">
          <h1><a id="heroTitle" href="/" data-nav>香港幼稚園排名</a></h1>
          <button id="langToggle" type="button" class="btn-secondary" lang="en">EN</button>
        </div>
        <p id="heroSubtitle" data-i18n="heroSubtitle"></p>
        <p class="subtext" data-i18n="disclaimer"></p>

        <details class="meta-panel">
          <summary id="metaSummary"></summary>
          <div class="meta-body">
            <div class="meta-row" id="metaSource"></div>
            <div class="meta-row" id="metaTotal"></div>
            <div class="meta-row" id="metaUpdated"></div>
            <div class="meta-row" id="metaMethod"></div>
            <div class="meta-row" id="metaTypes"></div>
          </div>
        </details>

        <div class="filters">
          <label for="searchInput" class="visually-hidden" data-i18n="searchLabel"></label>
          <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" />
          <label for="filterArea" class="visually-hidden" data-i18n="district"></label>
          <select id="filterArea"></select>
          <label for="filterType" class="visually-hidden" data-i18n="type"></label>
          <select id="filterType"></select>
          <label for="filterScore" class="visually-hidden" data-i18n="minScorePlaceholder"></label>
          <input id="filterScore" type="number" min="0" max="5" step="0.1" inputmode="decimal" data-i18n-placeholder="minScorePlaceholder" />
          <button id="filterReset" type="button" class="btn-secondary" data-i18n="resetFilters"></button>
        </div>

        <div id="accountPanel" class="account-panel hidden">
          <span id="authStatusText" class="account-text"></span>
          <span>
            <button id="googleLoginBtn" type="button" class="hidden" data-i18n="loginWithGoogle"></button>
            <button id="logoutBtn" type="button" class="btn-secondary hidden" data-i18n="logout"></button>
          </span>
        </div>

        <div id="verifyPanel" class="verify-panel hidden">
          <p data-i18n="verifyIntro"></p>
          <div class="account-row">
            <button id="sendCodeBtn" type="button" data-i18n="sendVerifyCode"></button>
            <label for="verifyCodeInput" class="visually-hidden" data-i18n="verifyCodePlaceholder"></label>
            <input id="verifyCodeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-i18n-placeholder="verifyCodePlaceholder" />
            <button id="verifyCodeBtn" type="button" data-i18n="verifyEmail"></button>
          </div>
          <div id="verifyCaptcha" class="account-row"></div>
          <div id="verifyMessage" class="form-message" role="status" aria-live="polite"></div>
        </div>
      </header>

      <div id="status" class="status" role="status" aria-live="polite">正在載入學校資料...</div>

      <section id="homeView" class="hidden">
        <div class="ad-slot hidden" data-ad-view="home">
          <div class="ad-label" data-i18n="adLabel"></div>
          <div class="ad-box"></div>
        </div>
        <div id="areaContainer"></div>
      </section>

      <section id="areaView" class="hidden">
        <div class="toolbar">
          <a class="button btn-secondary" href="/" data-nav data-i18n="backHome"></a>
        </div>
        <article class="area-section">
          <div class="area-head"><h2 id="areaTitle"></h2></div>
          <div class="ad-slot hidden" data-ad-view="area">
            <div class="ad-label" data-i18n="adLabel"></div>
            <div class="ad-box"></div>
          </div>
          <div id="areaTable"></div>
        </article>
      </section>

      <section id="searchView" class="hidden">
        <div class="toolbar">
          <a class="button btn-secondary" href="/" data-nav data-i18n="backHome"></a>
        </div>
        <article class="area-section">
          <div class="area-head"><h2 id="searchTitle"></h2></div>
          <div id="searchResults"></div>
        </article>
      </section>

      <section id="profileView" class="hidden">
        <div class="toolbar" id="profileToolbar"></div>
        <article id="profileCard" class="profile"></article>
        <div class="ad-slot hidden" data-ad-view="profile">
          <div class="ad-label" data-i18n="adLabel"></div>
          <div class="ad-box"></div>
        </div>
      </section>
    </main>

    <button id="chatToggle" type="button" class="chat-toggle" aria-controls="chatPanel" aria-expanded="false" data-i18n="chatToggle"></button>
    <section id="chatPanel" class="chat-panel hidden" aria-labelledby="chatTitle">
      <div class="chat-head">
        <span id="chatTitle" data-i18n="chatTitle"></span>
        <button id="chatClose" type="button" class="btn-secondary" data-i18n-aria-label="chatClose">×</button>
      </div>
      <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
      <div id="chatQuick" class="chat-quick"></div>
      <form id="chatForm" class="chat-input">
        <label for="chatInput" class="visually-hidden" data-i18n="chatPlaceholder"></label>
        <input id="chatInput" type="text" autocomplete="off" data-i18n-placeholder="chatPlaceholder" />
        <button id="chatSend" type="submit" data-i18n="chatSend"></button>
      </form>
    </section>

        // ---------- HTML escaping ----------

        class SafeHtml {
          constructor(value) {
            this.value = value;
          }
        }

        const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

        function renderValue(value) {
          if (value instanceof SafeHtml) return value.value;
          if (Array.isArray(value)) return value.map(renderValue).join('');
          if (value === null || value === undefined || value === false) return '';
          return String(value).replace(/[&<>"']/g, (ch) => ESCAPES[ch]);
        }

        /** Template tag: every interpolated value is escaped unless it is itself html`...`. */
        function html(strings, ...values) {
          let out = strings[0];
          values.forEach((value, index) => {
            out += renderValue(value) + strings[index + 1];
          });
          return new SafeHtml(out);
        }

        function setHtml(target, content) {
          target.innerHTML = renderValue(content);
        }

        // ---------- small utilities ----------

        const storage = {
          get(key) {
            try {
              return window.localStorage.getItem(key);
            } catch {
              return null;
            }
          },
          set(key, value) {
            try {
              window.localStorage.setItem(key, value);
            } catch {
              // Storage unavailable (private mode); the preference just isn't remembered.
            }
          },
        };

        function t(key, params) {
          const template = I18N[state.lang][key] ?? I18N.zh[key] ?? key;
          return params ? template.replace(/\{(\w+)\}/g, (_, name) => String(params[name] ?? '')) : template;
        }

        function normalizeSearch(value) {
          return String(value || '')
            .normalize('NFKC')
            .toLowerCase()
            .replace(/[^\p{L}\p{N}]+/gu, '');
        }

        function debounce(fn, ms) {
          let timer;
          return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), ms);
          };
        }

        function formatArea(areaKey) {
          const district = DISTRICTS[String(areaKey || '').toLowerCase()];
          return district ? district[state.lang] : String(areaKey || '');
        }

        function areaOrder(areaKey) {
          const index = DISTRICT_ORDER.indexOf(areaKey);
          return index === -1 ? DISTRICT_ORDER.length : index;
        }

        function formatDate(value) {
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return '';
          return date.toLocaleDateString(state.lang === 'zh' ? 'zh-HK' : 'en-GB', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
          });
        }

        function formatRating(value) {
          return typeof value === 'number' ? value.toFixed(1) : '';
        }

        function schoolPrimaryName(school) {
          return state.lang === 'zh' ? school.chineseName || school.name : school.name || school.chineseName;
        }

        function schoolSecondaryName(school) {
          const secondary = state.lang === 'zh' ? school.name : school.chineseName;
          return secondary && secondary !== schoolPrimaryName(school) ? secondary : '';
        }

        function typeLabel(type) {
          return t(`type${type}`);
        }

        function setStatus(message, kind) {
          el.status.textContent = message || '';
          el.status.classList.toggle('error', kind === 'error');
          el.status.classList.toggle('hidden', !message);
        }

        function setMessage(target, message, kind) {
          if (!target) return;
          target.textContent = message || '';
          target.classList.toggle('ok', kind === 'ok');
          target.classList.toggle('error', kind === 'error');
        }

        async function fetchJson(url) {
          const response = await fetch(url, { credentials: 'include' });
          if (!response.ok) {
            const error = new Error(`Request failed (${response.status})`);
            error.status = response.status;
            throw error;
          }
          return response.json();
        }

        async function postJson(url, body) {
          const response = await fetch(url, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {}),
          });
          const data = await response.json().catch(() => ({}));
          return { ok: response.ok, status: response.status, data };
        }

        function errorMessage(result) {
          if (result.status === 429) return t('rateLimited');
          if (result.status === 401) return t('sessionExpired');
          return result.data?.error || t('failed');
        }

        // ---------- data ----------

        function buildSearchIndex(schools) {
          state.searchIndex = new Map(
            schools.map((school) => [
              school.id,
              [school.name, school.chineseName].map(normalizeSearch).join('|'),
            ]),
          );
        }

        async function ensureSchools(force = false) {
          if (state.schools && !force) return state.schools;
          if (!state.schoolsPromise || force) {
            const request = fetchJson('/api/kindergartens').then((schools) => {
              state.schools = schools;
              buildSearchIndex(schools);
              renderMeta();
              renderAreaOptions();
              return schools;
            });
            state.schoolsPromise = request;
            request.catch(() => {}).finally(() => {
              if (state.schoolsPromise === request) state.schoolsPromise = null;
            });
          }
          return state.schoolsPromise;
        }

        function applyFilters(schools) {
          const type = state.filters.type;
          const minScore = state.filters.minScore === '' ? null : Number(state.filters.minScore);
          return schools.filter((school) => {
            if (type && school.type !== type) return false;
            if (minScore !== null && !(school.weightedScore >= minScore)) return false;
            return true;
          });
        }

        function searchSchools(query) {
          const needle = normalizeSearch(query);
          if (!needle) return [];
          return (state.schools || [])
            .filter((school) => (state.searchIndex.get(school.id) || '').includes(needle))
            .sort((a, b) => (b.weightedScore ?? -1) - (a.weightedScore ?? -1) || a.name.localeCompare(b.name));
        }

        function groupByArea(schools) {
          const grouped = new Map();
          for (const school of schools) {
            const key = school.area?.name || 'other';
            if (!grouped.has(key)) grouped.set(key, []);
            grouped.get(key).push(school);
          }
          return new Map([...grouped.entries()].sort(([a], [b]) => areaOrder(a) - areaOrder(b) || a.localeCompare(b)));
        }

        function schoolHref(school) {
          return `/?school=${encodeURIComponent(school.id)}`;

        function ratingCell(value, count) {

        }

        function schoolTable(schools, { showDistrict = false } = {}) {
          if (!schools.length) return html`<p class="empty">${t('noSchools')}</p>`;

          const rows = schools.map((school) => {
            const secondary = schoolSecondaryName(school);
            const href = schoolHref(school);
            return html`
              <tr class="school-row" data-href="${href}">
                <td class="col-rank">${school.areaRank ? `#${school.areaRank}` : '–'}</td>
                <td>
                  <a class="school-link" href="${href}" data-nav>${schoolPrimaryName(school)}</a>
                  ${secondary ? html`<div class="subtext">${secondary}</div>` : ''}
                  <div class="tags">
                    <span class="tag tag-${school.type}">${typeLabel(school.type)}</span>

                <td class="col-num col-hide-mobile">${ratingCell(school.googleRating, school.googleReviewCount)}</td>
              </tr>`;
          });

          return html`
            <div class="table-wrap">
              <table class="area-table">
                <thead>
                  <tr>
                    <th class="col-rank">${t('rank')}</th>
                    <th>${t('school')}</th>

        function showView(name) {

        function setDocumentTitle(prefix) {
          document.title = prefix ? `${prefix} | ${t('siteTitle')}` : t('siteTitle');
        }

        function renderMeta() {
          const schools = state.schools || [];
          el.metaSummary.textContent = t('aboutRanking');
          el.metaSource.textContent = `${t('dataSource')}: ${t('sourceText')}`;
          el.metaTotal.textContent = `${t('totalSchools')}: ${schools.length}`;
          el.metaMethod.textContent = `${t('method')}: ${t('methodText')}`;
          el.metaTypes.textContent = `${t('typeNote')}: ${t('typeNoteText')}`;

          const synced = schools
            .map((school) => school.googleUpdatedAt)
            .filter(Boolean)
            .sort()
            .pop();
          el.metaUpdated.textContent = synced ? `${t('googleSynced')}: ${formatDate(synced)}` : '';
          el.metaUpdated.classList.toggle('hidden', !synced);

        function renderAreaOptions() {
          const areas = [...new Set((state.schools || []).map((school) => school.area?.name).filter(Boolean))].sort(
            (a, b) => areaOrder(a) - areaOrder(b) || a.localeCompare(b),
          );
          const current = new URLSearchParams(window.location.search).get('area') || '';
          setHtml(el.filterArea, [
            html`<option value="">${t('allAreas')}</option>`,
            ...areas.map((area) => html`<option value="${area}">${formatArea(area)}</option>`),
          ]);
          el.filterArea.value = areas.includes(current) ? current : '';
        }

        function renderTypeOptions() {
          setHtml(el.filterType, [
            html`<option value="">${t('allTypes')}</option>`,
            ...['PUBLIC', 'PRIVATE', 'INTERNATIONAL'].map((type) => html`<option value="${type}">${typeLabel(type)}</option>`),
          ]);
          el.filterType.value = state.filters.type;
        }

        function applyStaticTranslations() {
          document.documentElement.lang = state.lang === 'zh' ? 'zh-HK' : 'en';
          el.heroTitle.textContent = t('heroTitle');
          el.langToggle.textContent = state.lang === 'zh' ? 'EN' : '中文';
          el.langToggle.lang = state.lang === 'zh' ? 'en' : 'zh-HK';
          for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = t(node.dataset.i18n);
          for (const node of document.querySelectorAll('[data-i18n-placeholder]')) node.placeholder = t(node.dataset.i18nPlaceholder);
          for (const node of document.querySelectorAll('[data-i18n-aria-label]')) node.setAttribute('aria-label', t(node.dataset.i18nAriaLabel));
          renderTypeOptions();
          renderAreaOptions();
          renderMeta();
          renderAccount();
          renderChatQuickActions();
        }

        async function showHome() {
          setStatus(t('loadingSchools'));
          const schools = await ensureSchools();
          const grouped = groupByArea(applyFilters(schools));

          const sections = [...grouped.entries()].map(
            ([area, list]) => html`
              <section class="area-section">
                <div class="area-head">
                  <h3>${formatArea(area)}</h3>
                  <a class="button btn-secondary" href="/?area=${encodeURIComponent(area)}" data-nav>${t('viewAll', { count: list.length })}</a>
                </div>
                ${schoolTable(list.slice(0, TOP_PER_AREA))}
              </section>`,
          );

          setHtml(el.areaContainer, sections.length ? sections : html`<p class="empty">${t('noSchools')}</p>`);
          el.searchInput.value = '';
          el.filterArea.value = '';
          setDocumentTitle('');
          showView('home');
          setStatus(t('showingTop5'));
        }

        async function showArea(areaKey) {
          setStatus(t('loadingSchools'));
          const schools = await ensureSchools();
          const list = applyFilters(schools.filter((school) => school.area?.name === areaKey));

          el.areaTitle.textContent = t('areaTitle', { area: formatArea(areaKey), count: list.length });
          setHtml(el.areaTable, schoolTable(list));
          el.searchInput.value = '';
          el.filterArea.value = areaKey;
          setDocumentTitle(t('areaPageTitle', { area: formatArea(areaKey) }));
          showView('area');
          setStatus(t('showingArea'));
        }

        async function showSearch(query) {
          await ensureSchools();
          const matches = applyFilters(searchSchools(query));
          const shown = matches.slice(0, MAX_SEARCH_RESULTS);

          // Typing a district name probably means "show me that district".
          const district = detectDistrict(query.toLowerCase());
          const districtLink = district
            ? html`<p><a href="/?area=${encodeURIComponent(district)}" data-nav>${t('viewDistrict', { area: formatArea(district) })}</a></p>`
            : '';

          el.searchTitle.textContent = t('searchTitle', { query, count: matches.length });
          setHtml(
            el.searchResults,
            html`${districtLink}${
              matches.length
                ? html`${schoolTable(shown, { showDistrict: true })}${
                    matches.length > shown.length ? html`<p class="subtext">${t('searchTooMany', { count: shown.length })}</p>` : ''
                  }`
                : html`<p class="empty">${t('searchNone', { query })}</p>`
            }`,
          );
          // Don't overwrite what the user is still typing.
          if (document.activeElement !== el.searchInput && el.searchInput.value.trim() !== query) {
            el.searchInput.value = query;
          }
          el.filterArea.value = '';
          setDocumentTitle(t('searchTitle', { query, count: matches.length }));
          showView('search');
          setStatus('');
        }

        function reviewSection(school) {
          if (!state.user) {
            if (!state.config.googleLoginEnabled) {
              return html`<div class="review-form"><p class="subtext">${t('reviewUnavailable')}</p></div>`;
            }
            return html`
              <div class="review-form">
                <h3>${t('reviewTitle')}</h3>
                <p>${t('reviewNeedLogin')}</p>
                <div><button type="button" data-action="login">${t('loginWithGoogle')}</button></div>
              </div>`;
          }

          if (!state.user.canReview) {
            return html`
              <div class="review-form">
                <h3>${t('reviewTitle')}</h3>
                <p>${t('reviewNeedVerify')}</p>
              </div>`;
          }

          const mine = school.myReview;
          const stars = [5, 4, 3, 2, 1].map(
            (n) => html`
              <input type="radio" id="star${n}" name="rating" value="${n}" ${mine && mine.rating === n ? html`checked` : ''} />
              <label for="star${n}" title="${t('stars', { n })}" aria-label="${t('stars', { n })}">★</label>`,
          );

          return html`
            <form class="review-form" id="reviewForm" novalidate>
              <h3>${mine ? t('reviewTitleExisting') : t('reviewTitle')}</h3>
              ${mine ? html`<p class="subtext">${t('reviewExistingNote', { date: formatDate(mine.createdAt) })}</p>` : ''}
              <fieldset class="star-fieldset">
                <legend>${t('reviewRating')}</legend>
                <div class="star-input">${stars}</div>
              </fieldset>
              <label for="reviewComment">${t('reviewComment')}</label>
              <textarea id="reviewComment" name="comment" rows="3" maxlength="1000">${mine?.comment || ''}</textarea>
              <p class="subtext">${t('commentsHidden')}</p>
              <div id="reviewCaptcha"></div>
              <div><button type="submit">${mine ? t('reviewUpdate') : t('reviewSubmit')}</button></div>
              <div class="form-message" role="status" aria-live="polite"></div>
            </form>`;
        }

        function mapsUrl(school) {
          const query = encodeURIComponent(school.googleFormattedAddress || school.chineseName || school.name);
          const placeId = school.googlePlaceId ? `&query_place_id=${encodeURIComponent(school.googlePlaceId)}` : '';
          return `https://www.google.com/maps/search/?api=1&query=${query}${placeId}`;
        }

        async function showProfile(schoolId, { message } = {}) {
          setStatus(t('loadingProfile'));
          let school;
          try {
            school = await fetchJson(`/api/kindergartens/${encodeURIComponent(schoolId)}`);
          } catch (error) {
            if (error.status !== 404) throw error;
            setHtml(el.profileToolbar, html`<a class="button btn-secondary" href="/" data-nav>${t('backHome')}</a>`);
            setHtml(el.profileCard, html`<p>${t('notFound')}</p>`);
            setDocumentTitle(t('notFound'));
            showView('profile');
            setStatus('');
            return;
          }

          const areaKey = school.area?.name || '';
          const area = formatArea(areaKey);
          const secondary = schoolSecondaryName(school);
          const hasScore = typeof school.weightedScore === 'number';

          setHtml(
            el.profileToolbar,
            html`
              <a class="button btn-secondary" href="/?area=${encodeURIComponent(areaKey)}" data-nav>${t('backToArea', { area })}</a>
              <a class="button btn-secondary" href="/" data-nav>${t('backHome')}</a>`,
          );

          setHtml(
            el.profileCard,
            html`
              <h2>${schoolPrimaryName(school)}</h2>
              ${secondary ? html`<p class="subtext">${secondary}</p>` : ''}
              <div class="tags">
                <span class="tag tag-${school.type}">${typeLabel(school.type)}</span>
                <span class="tag">${area}</span>
              </div>

              <div class="score-cards">
                <div class="score-card">
                  <div class="label">${t('score')}</div>
                  <div class="value">${hasScore ? school.weightedScore.toFixed(2) : '–'}</div>
                  <div class="hint">${school.areaRank ? t('rankedIn', { area, rank: school.areaRank, total: school.areaTotal }) : t('unranked')}</div>
                </div>
                <div class="score-card">
                  <div class="label">${t('parents')}</div>
                  <div class="value">${school.avgRating !== null ? `${formatRating(school.avgRating)} ★` : '–'}</div>
                  <div class="hint">${school.reviewCount ? t('parentHint', { count: school.reviewCount }) : t('parentHintNone')}</div>
                </div>
                <div class="score-card">
                  <div class="label">${t('google')}</div>
                  <div class="value">${school.googleRating !== null ? `${formatRating(school.googleRating)} ★` : '–'}</div>
                  <div class="hint">${school.googleRating !== null ? t('googleHint', { count: school.googleReviewCount ?? '?' }) : t('googleHintNone')}</div>
                </div>
              </div>

              <dl class="details">
                <dt>${t('chineseName')}</dt><dd>${school.chineseName || '–'}</dd>
                <dt>${t('englishName')}</dt><dd>${school.name || '–'}</dd>
                <dt>${t('district')}</dt><dd>${area}</dd>
                <dt>${t('type')}</dt><dd>${typeLabel(school.type)}</dd>
                ${
                  school.googleFormattedAddress
                    ? html`<dt>${t('address')}</dt>
                        <dd>${school.googleFormattedAddress} · <a href="${mapsUrl(school)}" target="_blank" rel="noopener">${t('openMap')}</a></dd>`
                    : ''
                }
              </dl>

              ${reviewSection(school)}`,
          );

          const form = $('reviewForm');
          if (form) {
            form.addEventListener('submit', (event) => {
              event.preventDefault();
              submitReview(form, school);
            });
            mountCaptcha($('reviewCaptcha'), form.querySelector('.form-message'));
            if (message) setMessage(form.querySelector('.form-message'), message, 'ok');
          }

          el.searchInput.value = '';
          el.filterArea.value = '';
          setDocumentTitle(schoolPrimaryName(school));
          showView('profile');
          setStatus('');
        }

        async function submitReview(form, school) {
          const messageEl = form.querySelector('.form-message');
          const rating = Number(form.querySelector('input[name="rating"]:checked')?.value || 0);
          if (!rating) {
            setMessage(messageEl, t('reviewPickRating'), 'error');
            return;
          }

          const captchaToken = captchaTokenOrNull(messageEl);
          if (!captchaToken) return;

          const button = form.querySelector('button[type="submit"]');
          button.disabled = true;
          setMessage(messageEl, t('submitting'));

          try {
            const result = await postJson('/api/reviews', {
              kindergartenId: school.id,
              rating,
              comment: form.elements.comment.value.trim(),
              captchaToken,
            });

            if (!result.ok) {
              setMessage(messageEl, errorMessage(result), 'error');
              resetCaptcha();
              if (result.status === 401) await refreshUser();
              return;
            }

            await ensureSchools(true);
            await showProfile(school.id, { message: result.data.updated ? t('reviewUpdated') : t('reviewSuccess') });
          } catch {
            setMessage(messageEl, t('failed'), 'error');
          } finally {
            button.disabled = false;
          }
        }

        // ---------- routing ----------

        async function route() {
          const params = new URLSearchParams(window.location.search);
          const schoolId = params.get('school');
          const query = (params.get('q') || '').trim();
          const area = params.get('area');

          try {
            if (schoolId) await showProfile(schoolId);
            else if (query) await showSearch(query);
            else if (area) await showArea(area);
            else await showHome();
          } catch (error) {
            console.error(error);
            setStatus(t('failed'), 'error');
          }
        }

        async function navigate(url, { replace = false, scroll = true } = {}) {
          const target = new URL(url, window.location.origin);
          const path = target.pathname + target.search;
          if (replace) window.history.replaceState(null, '', path);
          else window.history.pushState(null, '', path);
          await route();
          if (scroll) window.scrollTo(0, 0);
        }

        // ---------- account & email verification ----------

        async function refreshUser() {
          try {
            state.user = await fetchJson('/api/auth/me');
          } catch {
            state.user = null;
          }
          renderAccount();
        }

        function renderAccount() {
          const user = state.user;
          const loginEnabled = state.config.googleLoginEnabled;

          el.accountPanel.classList.toggle('hidden', !user && !loginEnabled);
          el.authStatusText.textContent = user ? t('authLoggedIn', { email: user.email }) : t('authGuest');
          el.googleLoginBtn.classList.toggle('hidden', Boolean(user) || !loginEnabled);
          el.logoutBtn.classList.toggle('hidden', !user);

          const needsVerification = Boolean(user) && !user.canReview;
          const wasHidden = el.verifyPanel.classList.contains('hidden');
          el.verifyPanel.classList.toggle('hidden', !needsVerification);
          if (needsVerification && wasHidden) mountCaptcha(el.verifyCaptcha, el.verifyMessage);
        }

        function startLogin() {
          const returnTo = window.location.pathname + window.location.search;
          window.location.href = `/api/auth/google?returnTo=${encodeURIComponent(returnTo)}`;
        }

        async function logout() {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
          state.user = null;
          renderAccount();
          await route();
        }

        async function sendVerificationCode() {
          const captchaToken = captchaTokenOrNull(el.verifyMessage);
          if (!captchaToken) return;

          el.sendCodeBtn.disabled = true;
          try {
            const result = await postJson('/api/auth/email/send-code', { captchaToken });
            resetCaptcha();
            if (!result.ok) {
              setMessage(el.verifyMessage, errorMessage(result), 'error');
              return;
            }
            if (result.data.emailVerified) {
              await afterVerified();
              return;
            }
            setMessage(
              el.verifyMessage,
              result.data.devCode ? t('verifyCodeSentDev', { code: result.data.devCode }) : t('verifyCodeSent'),
              'ok',
            );
            el.verifyCodeInput.focus();
          } catch {
            setMessage(el.verifyMessage, t('failed'), 'error');
          } finally {
            el.sendCodeBtn.disabled = false;
          }
        }

        async function verifyEmailCode() {
          const code = el.verifyCodeInput.value.trim();
          if (!/^\d{6}$/.test(code)) {
            setMessage(el.verifyMessage, t('verifyCodeInvalid'), 'error');
            return;
          }

          const captchaToken = captchaTokenOrNull(el.verifyMessage);
          if (!captchaToken) return;

          el.verifyCodeBtn.disabled = true;
          try {
            const result = await postJson('/api/auth/email/verify', { code, captchaToken });
            resetCaptcha();
            if (!result.ok) {
              setMessage(el.verifyMessage, errorMessage(result), 'error');
              return;
            }
            el.verifyCodeInput.value = '';
            await afterVerified();
          } catch {
            setMessage(el.verifyMessage, t('failed'), 'error');
          } finally {
            el.verifyCodeBtn.disabled = false;
          }
        }

        async function afterVerified() {
          await refreshUser();
          setStatus(t('verifyCodeSuccess'));
          if (state.view === 'profile') await route();
        }

        // ---------- CAPTCHA ----------

        const captcha = { loading: null, widgetId: null, token: '' };

        function captchaApi() {
          return state.config.provider === 'turnstile' ? window.turnstile : window.grecaptcha;
        }

        function loadCaptchaProvider() {
          if (captcha.loading) return captcha.loading;
          captcha.loading = new Promise((resolve, reject) => {
            window.__onCaptchaLoad = () => resolve();
            const script = document.createElement('script');
            script.async = true;
            script.defer = true;
            script.src =
              state.config.provider === 'turnstile'
                ? 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__onCaptchaLoad'
                : `https://www.google.com/recaptcha/api.js?render=explicit&onload=__onCaptchaLoad&hl=${state.lang === 'zh' ? 'zh-HK' : 'en'}`;
            script.onerror = () => {
              captcha.loading = null;
              reject(new Error('captcha-load-failed'));
            };
            document.head.appendChild(script);
          });
          return captcha.loading;
        }

        /** Renders a fresh CAPTCHA widget into `container` (no-op when CAPTCHA isn't configured). */
        async function mountCaptcha(container, messageEl) {
          captcha.token = '';
          captcha.widgetId = null;
          if (!state.config.siteKey || !container) return;

          try {
            await loadCaptchaProvider();
          } catch {
            setMessage(messageEl, t('captchaLoadFailed'), 'error');
            return;
          }
          if (!container.isConnected) return;

          container.innerHTML = '';
          const host = document.createElement('div');
          container.appendChild(host);
          captcha.widgetId = captchaApi().render(host, {
            sitekey: state.config.siteKey,
            callback: (token) => {
              captcha.token = token;
            },
            'expired-callback': () => {
              captcha.token = '';
            },
          });
        }

        function captchaTokenOrNull(messageEl) {
          // Without a site key the server only accepts requests outside production (local development).
          if (!state.config.siteKey) return 'dev-bypass';
          if (!captcha.token) {
            setMessage(messageEl, t('captchaMissing'), 'error');
            return null;
          }
          return captcha.token;
        }

        function resetCaptcha() {
          captcha.token = '';
          if (captcha.widgetId === null) return;
          try {
            captchaApi().reset(captcha.widgetId);
          } catch {
            // Widget already removed from the page.
          }
        }

        // ---------- ads ----------

        const mountedAds = new Set();

        function isAdsConfigured() {
          return (
            /^ca-pub-\d{16}$/.test(adConfig.publisherId) &&
            Object.values(adConfig.slots).every((slot) => /^\d+$/.test(slot))
          );
        }

        function mountAd(viewName) {
          if (!isAdsConfigured() || mountedAds.has(viewName) || !adConfig.slots[viewName]) return;
          const slot = document.querySelector(`[data-ad-view="${viewName}"]`);
          if (!slot) return;
          mountedAds.add(viewName);

          if (!document.getElementById('adsbygoogle-script')) {
            const script = document.createElement('script');
            script.id = 'adsbygoogle-script';
            script.async = true;
            script.crossOrigin = 'anonymous';
            script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${adConfig.publisherId}`;
            document.head.appendChild(script);
          }

          slot.classList.remove('hidden');
          setHtml(
            slot.querySelector('.ad-box'),
            html`<ins class="adsbygoogle" style="display:block" data-ad-client="${adConfig.publisherId}"
              data-ad-slot="${adConfig.slots[viewName]}" data-ad-format="auto" data-full-width-responsive="true"></ins>`,
          );
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch {
            // Ad blocked or failed to load; the page works without it.
          }
        }

        // ---------- chat assistant ----------

        const DISTRICT_TERMS = Object.entries(DISTRICTS)
          .flatMap(([key, district]) => {
            const zhShort = district.zh.endsWith('區') && district.zh.length > 2 ? [district.zh.slice(0, -1)] : [];
            return [key, district.zh, district.en.toLowerCase(), ...zhShort, ...district.aliases].map((term) => ({ key, term }));
          })
          .sort((a, b) => b.term.length - a.term.length);

        function detectDistrict(text) {
          for (const { key, term } of DISTRICT_TERMS) {
            if (/^[\x20-\x7e]+$/.test(term)) {
              const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              if (new RegExp(`(^|[^a-z])${escaped}($|[^a-z])`).test(text)) return key;
            } else if (text.includes(term)) {
              return key;
            }
          }
          return '';
        }

        function appendChatMessage(role, text) {
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble ${role === 'user' ? 'chat-user' : 'chat-bot'}`;
          bubble.textContent = text;
          el.chatMessages.appendChild(bubble);
          el.chatMessages.scrollTop = el.chatMessages.scrollHeight;
        }

        function renderChatQuickActions() {
          el.chatQuick.innerHTML = '';
          const quick = [
            [t('chatQuickTop5'), 'top 5'],
            [t('chatQuickMethod'), 'method'],
            [t('chatQuickReview'), 'review'],
            [t('chatQuickArea'), 'tuenmun'],
          ];
          for (const [label, intent] of quick) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            button.addEventListener('click', () => {
              appendChatMessage('user', label);
              handleChatIntent(intent);
            });
            el.chatQuick.appendChild(button);
          }
        }

        async function handleChatIntent(rawText) {
          const text = String(rawText || '').toLowerCase().trim();
          const mentionsSchool = /kindergarten|nursery|school|幼稚園|幼兒|學校/.test(text);

          // On phones the open chat would cover the page it just navigated to.
          const closeOnSmallScreens = () => {
            if (window.matchMedia('(max-width: 640px)').matches) toggleChat(false);
          };

          const district = mentionsSchool ? '' : detectDistrict(text);
          if (district) {
            appendChatMessage('bot', t('chatNavigating', { area: formatArea(district) }));
            await navigate(`/?area=${encodeURIComponent(district)}`);
            closeOnSmallScreens();
            return;
          }

          const intents = [
            [/top ?5|前 ?5|排行/, 'chatTop5'],
            [/method|how .*(rank|score|calculat)|計算|排名方法|點計|如何排名/, null],
            [/log ?in|sign ?in|登入|google/, 'chatLogin'],
            [/verif|驗證|電郵|email/, 'chatVerify'],
            [/review|rate|rating|評分|評論/, 'chatReview'],
            [/area|district|地區/, 'chatAreas'],
          ];
          for (const [pattern, key] of intents) {
            if (pattern.test(text)) {
              appendChatMessage('bot', key ? t(key) : t('methodText'));
              return;
            }
          }

          await ensureSchools().catch(() => []);
          const matches = searchSchools(rawText);
          if (matches.length) {
            appendChatMessage('bot', t('chatSearching', { count: matches.length }));
            await navigate(`/?q=${encodeURIComponent(String(rawText).trim())}`);
            closeOnSmallScreens();
            return;
          }

          appendChatMessage('bot', t('chatUnknown'));
        }

        function toggleChat(open) {
          el.chatPanel.classList.toggle('hidden', !open);
          el.chatToggle.setAttribute('aria-expanded', String(open));
          if (open && !state.chatStarted) {
            state.chatStarted = true;
            appendChatMessage('bot', t('chatWelcome'));
            appendChatMessage('bot', t('chatHint'));
          }
          if (open) el.chatInput.focus();
        }

        // ---------- events ----------

        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target || event.defaultPrevented) return;

          if (target.closest('[data-action="login"]')) {
            startLogin();
            return;
          }

          const modified = event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey;
          const link = target.closest('a[data-nav]');
          if (link) {
            if (modified) return;
            event.preventDefault();
            navigate(link.getAttribute('href'));
            return;
          }

          // Clicking anywhere on a school row opens the school.
          const row = target.closest('tr[data-href]');
          if (row && !modified && !target.closest('a, button')) {
            navigate(row.dataset.href);
          }
        });

        window.addEventListener('popstate', () => route());

        el.langToggle.addEventListener('click', () => {
          state.lang = state.lang === 'zh' ? 'en' : 'zh';
          storage.set('lang', state.lang);
          applyStaticTranslations();
          route();
        });

        el.searchInput.addEventListener(
          'input',
          debounce(() => {
            const query = el.searchInput.value.trim();
            const url = query ? `/?q=${encodeURIComponent(query)}` : '/';
            navigate(url, { replace: state.view === 'search', scroll: false });
          }, 200),
        );

        el.filterArea.addEventListener('change', () => {
          const area = el.filterArea.value;
          navigate(area ? `/?area=${encodeURIComponent(area)}` : '/');
        });

        // Filters narrow the lists; a school profile doesn't change.
        el.filterType.addEventListener('change', () => {
          state.filters.type = el.filterType.value;
          if (state.view !== 'profile') route();
        });

        el.filterScore.addEventListener(
          'input',
          debounce(() => {
            state.filters.minScore = el.filterScore.value;
            if (state.view !== 'profile') route();
          }, 250),
        );

        el.filterReset.addEventListener('click', () => {
          state.filters = { type: '', minScore: '' };
          el.filterType.value = '';
          el.filterScore.value = '';
          el.searchInput.value = '';
          navigate('/');
        });

        el.googleLoginBtn.addEventListener('click', startLogin);
        el.logoutBtn.addEventListener('click', logout);
        el.sendCodeBtn.addEventListener('click', sendVerificationCode);
        el.verifyCodeBtn.addEventListener('click', verifyEmailCode);
        el.verifyCodeInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') verifyEmailCode();
        });

        el.chatToggle.addEventListener('click', () => toggleChat(el.chatPanel.classList.contains('hidden')));
        el.chatClose.addEventListener('click', () => toggleChat(false));
        el.chatForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const text = el.chatInput.value.trim();
          if (!text) return;
          appendChatMessage('user', text);
          el.chatInput.value = '';
          handleChatIntent(text);
        });

        // ---------- start ----------

        async function init() {
          state.lang = storage.get('lang') === 'en' ? 'en' : 'zh';

          const params = new URLSearchParams(window.location.search);
          const loginFailed = params.get('login') === 'failed';
          if (loginFailed) {
            params.delete('login');
            const rest = params.toString();
            window.history.replaceState(null, '', rest ? `/?${rest}` : '/');
          }

          applyStaticTranslations();
          const [config, user] = await Promise.all([
            fetchJson('/api/auth/captcha-config').catch(() => null),
            fetchJson('/api/auth/me').catch(() => null),
          ]);
          if (config) state.config = config;
          state.user = user;
          renderAccount();

          await route();
          if (loginFailed) setStatus(t('loginFailed'), 'error');
        }

        init();
      })();
    </script>
  </body>
</html>
